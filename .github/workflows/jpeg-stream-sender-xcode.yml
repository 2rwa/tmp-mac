name: JPEG Stream Sender Xcode build and source ZIP

on:
  push:
    branches: [main]
    paths:
      - 'JPEGStreamSender.xcodeproj/**'
      - 'jpeg-stream-sender/**'
      - '.github/workflows/jpeg-stream-sender-xcode.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          plutil -lint JPEGStreamSender.xcodeproj/project.pbxproj jpeg-stream-sender/Info.plist
          xcodebuild -list -project JPEGStreamSender.xcodeproj | tee artifacts/list.txt
      - name: Build and test geometry
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project JPEGStreamSender.xcodeproj -scheme JPEGStreamSender \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/JPEGStreamSenderBuild" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee artifacts/build.log
          EXE="$RUNNER_TEMP/JPEGStreamSenderBuild/Build/Products/Debug/JPEGStreamSender.app/Contents/MacOS/JPEGStreamSender"
          test -x "$EXE"
          "$EXE" --self-test | tee artifacts/self-test.txt
      - name: Bundle source project
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/JPEGStreamSender-source"
          ditto JPEGStreamSender.xcodeproj "$RUNNER_TEMP/JPEGStreamSender-source/JPEGStreamSender.xcodeproj"
          ditto jpeg-stream-sender "$RUNNER_TEMP/JPEGStreamSender-source/jpeg-stream-sender"
          (cd "$RUNNER_TEMP" && ditto -c -k --keepParent JPEGStreamSender-source "$GITHUB_WORKSPACE/artifacts/JPEGStreamSender-Xcode-source.zip")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jpeg-stream-sender-xcode-source
          path: artifacts/
          if-no-files-found: error
